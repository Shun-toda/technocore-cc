name: docs drift

# A translation that nobody checks is a translation that quietly stops being true.
# This fails the day the English original moves, which is the only honest way to
# publish one.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "docs/ja/**"
      - "scripts/check_docs_drift.py"
      - ".github/workflows/docs-drift.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare the translations against the documents they were made from
        run: python scripts/check_docs_drift.py
